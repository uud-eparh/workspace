<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OpenLedger{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
    <link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>🏗️ OpenLedger</h1>
                <span class="version">v{{ version }}</span>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    <span class="user-name">{{ user.full_name or user.username }}</span>
                    <div class="profile-dropdown">
                        <button class="profile-btn" onclick="toggleDropdown()">
                            <span class="avatar">{{ (user.full_name or user.username)[0] }}</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="dropdown-content" id="profileDropdown">
                            <a href="/dashboard">
                                <span class="icon">🏠</span> Дашборд
                            </a>
                            <a href="/dictionaries">
                                <span class="icon">📚</span> Справочники
                            </a>
                            <a href="/change-password">
                                <span class="icon">🔑</span> Сменить пароль
                            </a>
                            <hr>
                            <a href="/logout" class="logout-link">
                                <span class="icon">🚪</span> Выйти
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <p>&copy; 2026 OpenLedger. MIT License.</p>
        </footer>
    </div>

    <script>
        function toggleDropdown() {
            const dropdown = document.getElementById('profileDropdown');
            dropdown.classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.profile-dropdown')) {
                const dropdowns = document.getElementsByClassName('dropdown-content');
                for (let i = 0; i < dropdowns.length; i++) {
                    dropdowns[i].classList.remove('show');
                }
            }
        }
    </script>
</body>
</html>
