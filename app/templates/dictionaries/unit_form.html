{% extends "base.html" %}

{% block title %}{{ title }} - OpenLedger{% endblock %}

{% block content %}
<div class="form-container">
    <h2>{{ title }}</h2>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" class="form">
        <div class="form-group">
            <label for="code">Код *</label>
            <input type="text" id="code" name="code" 
                   value="{{ unit.code if unit else '' }}"
                   required maxlength="10">
            <small>Короткий код (шт, кг, м, л)</small>
        </div>

        <div class="form-group">
            <label for="name">Название *</label>
            <input type="text" id="name" name="name" 
                   value="{{ unit.name if unit else '' }}"
                   required maxlength="50">
        </div>

        <div class="form-group">
            <label for="symbol">Символ</label>
            <input type="text" id="symbol" name="symbol" 
                   value="{{ unit.symbol if unit else '' }}"
                   maxlength="10">
            <small>Краткий символ (шт, кг, м)</small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {% if is_edit %}Сохранить{% else %}Создать{% endif %}
            </button>
            <a href="/dictionaries/units" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

<style>
    .form-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
    }
    .form-container h2 {
        margin-bottom: 20px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
    }
    .form-group input {
        width: 100%;
        padding: 10px;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        font-size: 16px;
    }
    .form-group input:focus {
        outline: none;
        border-color: #667eea;
    }
    .form-group small {
        display: block;
        margin-top: 5px;
        color: #6c757d;
        font-size: 0.85em;
    }
    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }
    .form-actions .btn {
        padding: 10px 24px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        text-decoration: none;
        font-size: 16px;
    }
    .form-actions .btn-primary {
        background: #667eea;
        color: white;
    }
    .form-actions .btn-primary:hover {
        background: #5a67d8;
    }
    .form-actions .btn-secondary {
        background: #6c757d;
        color: white;
    }
    .form-actions .btn-secondary:hover {
        background: #5a6268;
    }
</style>
{% endblock %}
