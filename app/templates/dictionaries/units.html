{% extends "base.html" %}

{% block title %}{{ title }} - OpenLedger{% endblock %}

{% block content %}
<div class="dictionary-page">
    <div class="header-actions">
        <h2>{{ title }}</h2>
        <div>
            <a href="/dictionaries" class="btn btn-secondary">← Назад</a>
            <a href="/dictionaries/units/create" class="btn btn-primary">➕ Создать</a>
            <a href="/dictionaries/units/import" class="btn btn-secondary">📥 Импорт</a>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Код</th>
                    <th>Название</th>
                    <th>Символ</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for unit in units %}
                <tr>
                    <td><code>{{ unit.code }}</code></td>
                    <td>{{ unit.name }}</td>
                    <td>{{ unit.symbol or '-' }}</td>
                    <td>
                        <a href="/dictionaries/units/{{ unit.id }}/edit" class="btn-edit">✏️</a>
                        <button onclick="deleteUnit('{{ unit.id }}')" class="btn-delete">🗑️</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
    async function deleteUnit(unitId) {
        if (!confirm('Вы уверены, что хотите удалить эту единицу измерения?')) return;
        
        try {
            const response = await fetch(`/dictionaries/units/${unitId}/delete`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            });
            
            if (response.ok) {
                location.reload();
            } else {
                alert('Ошибка при удалении');
            }
        } catch (error) {
            alert('Ошибка сети');
        }
    }
</script>

<style>
    .dictionary-page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }
    .header-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .header-actions h2 {
        margin: 0;
    }
    .header-actions .btn {
        margin-left: 10px;
    }
    .btn-secondary {
        background: #6c757d;
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        display: inline-block;
    }
    .btn-secondary:hover {
        background: #5a6268;
    }
    .btn-primary {
        background: #667eea;
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        display: inline-block;
    }
    .btn-primary:hover {
        background: #5a67d8;
    }
    .btn-edit {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        padding: 4px 8px;
    }
    .btn-delete {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        padding: 4px 8px;
        color: #dc3545;
    }
    .btn-delete:hover {
        opacity: 0.7;
    }
    code {
        background: #f1f3f5;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.9em;
    }
</style>
{% endblock %}
