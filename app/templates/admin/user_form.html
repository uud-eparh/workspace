{% extends "base.html" %}

{% block title %}{% if is_edit %}Редактирование{% else %}Создание{% endif %} пользователя - OpenLedger{% endblock %}

{% block content %}
{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<form id="userForm" class="form">
    <div class="form-group">
        <label for="username">Логин *</label>
        <input type="text" id="username" name="username" 
               value="{{ target_user.username if target_user else '' }}"
               {% if is_edit %}readonly{% endif %}
               required minlength="3" maxlength="100">
    </div>

    <div class="form-group">
        <label for="full_name">ФИО</label>
        <input type="text" id="full_name" name="full_name" 
               value="{{ target_user.full_name if target_user else '' }}"
               maxlength="255">
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" 
               value="{{ target_user.email if target_user else '' }}">
    </div>

    <div class="form-group">
        <label for="department">Отдел</label>
        <input type="text" id="department" name="department" 
               value="{{ target_user.department if target_user else '' }}"
               maxlength="255">
    </div>

    <div class="form-group">
        <label for="subdivision">Подразделение</label>
        <input type="text" id="subdivision" name="subdivision" 
               value="{{ target_user.subdivision if target_user else '' }}"
               maxlength="255">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">
            {% if is_edit %}Сохранить{% else %}Создать{% endif %}
        </button>
        <a href="/admin/users" class="btn btn-secondary">Отмена</a>
    </div>
</form>

<script>
    document.getElementById('userForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const data = {};
        formData.forEach((value, key) => {
            if (value) data[key] = value;
        });
        
        const isEdit = {{ 'true' if is_edit else 'false' }};
        const userId = '{{ target_user.id if target_user else '' }}';
        
        const url = isEdit ? `/admin/users/${userId}` : '/admin/users';
        const method = isEdit ? 'PUT' : 'POST';
        
        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });
            
            if (response.ok) {
                window.location.href = '/admin/users';
            } else {
                const error = await response.json();
                alert('Ошибка: ' + (error.detail || 'Неизвестная ошибка'));
            }
        } catch (error) {
            alert('Ошибка сети');
        }
    });
</script>
{% endblock %}
