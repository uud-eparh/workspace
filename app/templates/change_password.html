{% extends "base.html" %}

{% block title %}Смена пароля - OpenLedger{% endblock %}

{% block content %}
<div class="change-password-container">
    <h2>🔐 Смена пароля</h2>
    <p>Пожалуйста, смените стандартный пароль для безопасности</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="alert alert-success">{{ success }}</div>
    {% endif %}

    <form action="/change-password" method="post" class="form">
        <div class="form-group">
            <label for="current_password">Текущий пароль</label>
            <input type="password" id="current_password" name="current_password" required>
        </div>

        <div class="form-group">
            <label for="new_password">Новый пароль</label>
            <input type="password" id="new_password" name="new_password" required minlength="8">
            <small>Минимум 8 символов</small>
        </div>

        <div class="form-group">
            <label for="confirm_password">Подтверждение пароля</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Сменить пароль</button>
            <a href="/dashboard" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

<style>
    .change-password-container {
        max-width: 500px;
        margin: 0 auto;
        padding: 20px;
    }
    .change-password-container h2 {
        text-align: center;
        margin-bottom: 10px;
    }
    .change-password-container p {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }
    .form-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
    }
    .form-actions .btn-secondary {
        background: #6c757d;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        display: inline-block;
        border: none;
        cursor: pointer;
    }
    .form-actions .btn-secondary:hover {
        background: #5a6268;
    }
</style>
{% endblock %}
